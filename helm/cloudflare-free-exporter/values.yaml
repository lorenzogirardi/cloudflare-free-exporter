replicaCount: 1

image:
  repository: lgirardi/cloudflare-free-exporter
  tag: "v1.0.3"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

# --- Cloudflare API token -----------------------------------------------------
# Either let the chart create the Secret (create: true + token set, e.g. from
# --set-string cloudflare.token=... or a values file kept out of git), or point
# existingSecret/existingSecretKey at a Secret you manage yourself.
cloudflare:
  create: false
  token: ""
  existingSecret: "cloudflare-exporter"
  existingSecretKey: "CF_API_TOKEN"

# --- Exporter configuration ---------------------------------------------------
config:
  # Comma separated zone names; empty means every zone the token can read.
  zones: ""
  # One cycle = 6 GraphQL queries per zone + 1 REST call. Cloudflare allows
  # 300 requests / 5 min per user, so 60s is safe up to ~7 zones.
  interval: 60
  topN: 25
  firewallWindowHours: 24
  logLevel: INFO

# Scraped through a prometheus.io/* annotation autodiscovery config (vmagent/Prometheus).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /metrics

# Set to true when running the Prometheus Operator or VictoriaMetrics operator
# with ServiceMonitor conversion enabled.
serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# Egress to the Cloudflare API only; no ingress except metrics scraping.
networkPolicy:
  enabled: false
  scrapeNamespace: monitoring

nodeSelector: {}
tolerations: []
affinity: {}
