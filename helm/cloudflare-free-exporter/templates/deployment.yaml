apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudflare-free-exporter.fullname" . }}
  labels:
    {{- include "cloudflare-free-exporter.labels" . | nindent 4 }}
spec:
  # The exporter keeps its window state in memory and every replica would issue the
  # same Cloudflare API calls, so one replica is the right answer, not a limitation.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudflare-free-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudflare-free-exporter.labels" . | nindent 8 }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cloudflare-free-exporter.secretName" . }}
                  key: {{ .Values.cloudflare.existingSecretKey }}
            - name: CF_ZONES
              value: {{ .Values.config.zones | quote }}
            - name: INTERVAL
              value: {{ .Values.config.interval | quote }}
            - name: TOP_N
              value: {{ .Values.config.topN | quote }}
            - name: FIREWALL_WINDOW_HOURS
              value: {{ .Values.config.firewallWindowHours | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            # The first cycle needs a few Cloudflare round trips.
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
